<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racing Nanterre Rugby</title>
<meta name="description" content="Racing Nanterre Rugby, club de rugby à Nanterre : école de rugby dès 3 ans, jeunes, seniors, féminines, rugby loisir et rugby adapté. Calendriers, résultats et contacts.">
<meta name="theme-color" content="#10264A">
<link rel="icon" href="photos/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CHARTE — couleurs du maillot
   ========================================================= */
:root{
  --marine:#10264A;      /* texte, navigation */
  --marine-2:#1C3A6B;
  --ciel:#8FAEDB;        /* bleu ciel du club */
  --ciel-fonce:#5C7FB8;
  --brume:#EEF3FA;       /* fond des sections alternées */
  --trait:#D9E2F0;       /* bordures fines */
  --texte-2:#4A5873;     /* texte secondaire (contraste AA sur blanc) */
  --pelouse:#1D6B42;     /* manche verte : victoires, domicile */
  --or:#F0B323;          /* manche or : action principale, heures */
  --defaite:#B5382A;
  --blanc:#FFFFFF;
  --affiche:'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --texte:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r-photo:6px; --r-bloc:14px; --r-bouton:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--texte);font-size:1rem;line-height:1.6;color:var(--marine);background:var(--blanc);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{width:min(1200px,100% - 2.5rem);margin-inline:auto}
h1,h2,h3{font-family:var(--affiche);font-weight:800;line-height:.98;letter-spacing:.005em}
h1{font-size:clamp(2.8rem,7vw,5.2rem)}
h2{font-size:clamp(2.1rem,4.4vw,3.2rem)}
h3{font-size:1.55rem}
p{max-width:68ch}
.secondaire{color:var(--texte-2)}
.petit{font-size:.875rem}
.chiffres-tab{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--or);outline-offset:3px;border-radius:4px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- En-tête ---------- */
.entete{position:sticky;top:0;z-index:50;background:var(--marine);color:var(--blanc)}
.entete .wrap{display:flex;align-items:center;gap:1.5rem;height:68px}
.marque{display:flex;align-items:center;gap:.7rem;text-decoration:none;min-width:0}
.marque img{width:44px;height:44px;background:#fff;border-radius:50%;padding:3px}
.marque b{font-family:var(--affiche);font-weight:800;font-size:1.45rem;line-height:1;display:block;white-space:nowrap;letter-spacing:.01em}
.marque small{display:block;font-size:.78rem;color:var(--ciel);margin-top:2px}
.nav{margin-left:auto;display:flex;align-items:center;gap:.15rem}
.nav a{text-decoration:none;font-weight:600;font-size:.92rem;padding:.55rem .7rem;border-radius:6px;color:#DCE6F5;position:relative}
.nav a:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav a.actif{color:#fff}
.nav a.actif::after{content:"";position:absolute;left:.7rem;right:.7rem;bottom:.2rem;height:3px;background:var(--or);border-radius:2px}
.nav a.externe{color:#DCE6F5}
.nav .essai{margin-left:.6rem;background:var(--or);color:var(--marine);border-radius:var(--r-bouton);padding:.6rem 1rem}
.nav .essai:hover{background:#FFC53D;color:var(--marine)}
.nav .essai.actif::after{display:none}
.burger{display:none;margin-left:auto;width:46px;height:46px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;align-items:center;justify-content:center}
@media (max-width:1080px){
  .burger{display:flex}
  .nav{position:fixed;inset:68px 0 auto 0;flex-direction:column;align-items:stretch;background:var(--marine);padding:.75rem 1.25rem 1.5rem;gap:.1rem;border-top:1px solid rgba(255,255,255,.1);visibility:hidden;opacity:0;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility .18s;max-height:calc(100dvh - 68px);overflow:auto}
  .menu-ouvert .nav{visibility:visible;opacity:1;transform:none}
  .nav a{font-size:1.1rem;padding:.9rem .75rem}
  .nav a.actif::after{left:0;right:auto;top:.8rem;bottom:.8rem;width:3px;height:auto}
  .nav .essai{margin:.75rem 0 0;text-align:center}
}
@media (max-width:420px){.marque b{font-size:1.2rem}.marque img{width:38px;height:38px}}

/* ---------- Boutons & liens ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.75rem 1.3rem;border-radius:var(--r-bouton);font-weight:700;text-decoration:none;border:2px solid transparent;transition:background .15s,border-color .15s,color .15s}
.btn-or{background:var(--or);color:var(--marine)}
.btn-or:hover{background:#FFC53D}
.btn-marine{background:var(--marine);color:#fff}
.btn-marine:hover{background:var(--marine-2)}
.btn-contour{border-color:currentColor}
.btn-contour:hover{background:rgba(255,255,255,.1)}
.lien{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--ciel)}
.lien:hover{text-decoration-color:var(--or)}
.actions{display:flex;gap:.75rem;flex-wrap:wrap}

/* ---------- Sections ---------- */
main{min-height:70vh}
.section{padding:clamp(3.5rem,8vw,6rem) 0}
.section.brume{background:var(--brume)}
.tete{display:flex;justify-content:space-between;align-items:end;gap:1rem 2rem;flex-wrap:wrap;margin-bottom:2rem}
.tete p{margin-top:.6rem;color:var(--texte-2)}

/* ---------- Accueil : héros + tableau d'affichage ---------- */
.heros{position:relative;color:#fff;background:var(--marine);min-height:min(92vh,820px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;isolation:isolate}
.heros .photo-fond{position:absolute;inset:0;background-size:cover;background-position:center 35%;opacity:0;transition:opacity 1.6s ease;z-index:-2}
.heros .photo-fond.on{opacity:1}
.heros::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(16,38,74,.45) 0%,rgba(16,38,74,.3) 25%,rgba(16,38,74,.82) 55%,var(--marine) 100%)}
.heros .texte{padding:clamp(5rem,12vh,8rem) 0 2.2rem}
.heros h1{max-width:13ch;font-size:clamp(3.1rem,8.4vw,6.6rem);text-wrap:balance}
.heros .chapo{margin:1.1rem 0 1.8rem;font-size:clamp(1.05rem,1.6vw,1.2rem);color:#DCE6F5;max-width:52ch}
.heros .photos-nav{display:flex;gap:.4rem;margin-top:1.6rem}
.heros .photos-nav button{width:28px;height:28px;border:0;background:transparent;padding:12px 0;display:grid;place-items:center}
.heros .photos-nav button::before{content:"";display:block;width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.heros .photos-nav button.on::before{background:var(--or)}

.tableau{background:#0A1C3A;border-top:4px solid var(--or)}
.tableau .wrap{display:grid;grid-template-columns:auto 1fr;gap:0 2rem;align-items:stretch}
.tableau .titre-tab{font-family:var(--affiche);font-weight:800;font-size:1.7rem;color:var(--or);padding:1.2rem 0;align-self:center;white-space:nowrap}
.affiches{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));border-left:1px solid rgba(255,255,255,.12)}
.affiche{display:block;text-decoration:none;color:#fff;padding:1.1rem 1.3rem;border-right:1px solid rgba(255,255,255,.12)}
.affiche:hover{background:rgba(255,255,255,.04)}
.affiche .equipe{font-size:.82rem;font-weight:700;color:var(--ciel)}
.affiche .adv{font-family:var(--affiche);font-size:1.45rem;font-weight:700;line-height:1.05;margin:.25rem 0 .45rem}
.affiche .quand{display:flex;gap:.6rem;align-items:baseline;font-size:.9rem;color:#DCE6F5}
.affiche .heure{font-family:var(--affiche);font-weight:800;font-size:1.35rem;color:var(--or)}
@media (max-width:760px){.tableau .wrap{grid-template-columns:1fr}.tableau .titre-tab{padding-bottom:0}.affiches{border-left:0;grid-template-columns:1fr}.affiche{border-right:0;border-top:1px solid rgba(255,255,255,.12);padding:1rem 0}}

@media (prefers-reduced-motion:no-preference){
  .heros .texte > *{animation:monte .7s cubic-bezier(.2,.7,.2,1) both}
  .heros .texte > :nth-child(2){animation-delay:.08s}
  .heros .texte > :nth-child(3){animation-delay:.16s}
  .tableau{animation:monte .7s .25s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes monte{from{opacity:0;transform:translateY(18px)}}

/* ---------- Accueil : repères ---------- */
.reperes{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--trait)}
.repere{padding:1.6rem 1.4rem 1.6rem 0;border-right:1px solid var(--trait)}
.repere + .repere{padding-left:1.4rem}
.repere:last-child{border-right:0}
.repere b{display:block;font-family:var(--affiche);font-size:2.6rem;line-height:1;font-weight:800}
.repere span{color:var(--texte-2);font-size:.92rem}
@media (max-width:760px){.reperes{grid-template-columns:1fr 1fr}.repere{border-right:0;padding:1.2rem 0!important;border-bottom:1px solid var(--trait)}.repere:nth-child(odd){padding-right:1rem!important}.repere b{font-size:2rem}}

/* ---------- Accueil : toutes les catégories par groupe ---------- */
.familles{display:grid;grid-template-columns:5fr 3fr 4fr 3fr;gap:2rem 2.5rem}
@media (max-width:1000px){.familles{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.familles{grid-template-columns:1fr;gap:2rem}}
.famille h3{font-size:1.35rem;padding-bottom:.6rem;border-bottom:3px solid var(--teinte,var(--marine));margin-bottom:.3rem}
.famille.f0{--teinte:var(--ciel)}.famille.f1{--teinte:var(--marine)}.famille.f2{--teinte:var(--or)}.famille.f3{--teinte:var(--pelouse)}
.palier{display:flex;align-items:center;gap:.9rem;text-decoration:none;padding:.6rem 0;border-bottom:1px solid var(--trait);min-height:60px}
.palier .pastille{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--teinte,var(--marine));display:grid;place-items:center;font-family:var(--affiche);font-weight:800;font-size:1.05rem;transition:background .15s,color .15s}
.palier:hover .pastille{background:var(--marine);border-color:var(--marine);color:#fff}
.palier:hover .nom{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.palier .nom{display:block;font-weight:700;line-height:1.25}
.palier .age{display:block;font-size:.85rem;color:var(--texte-2)}

/* ---------- Bloc présentation ---------- */
.deux{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.deux .photo{border-radius:var(--r-photo);overflow:hidden;aspect-ratio:4/3}
.deux .photo img{width:100%;height:100%;object-fit:cover}
.deux p + p{margin-top:.9rem}
@media (max-width:860px){.deux{grid-template-columns:1fr}}
.valeurs{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;margin-top:3rem}
.valeurs div{border-top:3px solid var(--marine);padding-top:.9rem}
.valeurs b{font-family:var(--affiche);font-size:1.4rem;font-weight:800;display:block;margin-bottom:.25rem}
.valeurs p{color:var(--texte-2);font-size:.95rem}
@media (max-width:860px){.valeurs{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.valeurs{grid-template-columns:1fr}}

/* ---------- Actus ---------- */
.une{display:grid;grid-template-columns:1.6fr 1fr;gap:1.5rem}
.une.seule{grid-template-columns:1fr}
.actu-grande,.actu-ligne{text-decoration:none;display:block}
.actu-grande .img{aspect-ratio:16/10;border-radius:var(--r-photo);overflow:hidden;background:var(--brume)}
.une.seule .actu-grande{display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:center}
.une.seule .actu-grande .img{aspect-ratio:3/2}
.actu-grande img,.actu-ligne img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.actu-grande:hover img,.actu-ligne:hover img{transform:scale(1.03)}
.actu-grande h3{font-size:clamp(1.8rem,3vw,2.4rem);margin:.9rem 0 .5rem}
.actu-grande:hover h3,.actu-ligne:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.meta{font-size:.85rem;color:var(--texte-2);font-weight:600}
.meta .etiquette{color:var(--pelouse)}
.liste-actus{display:grid;gap:1.25rem;align-content:start}
.actu-ligne{display:grid;grid-template-columns:120px 1fr;gap:1rem;align-items:start;padding-bottom:1.25rem;border-bottom:1px solid var(--trait)}
.actu-ligne .img{aspect-ratio:1;border-radius:var(--r-photo);overflow:hidden;background:var(--brume)}
.actu-ligne h3{font-size:1.3rem;margin-top:.2rem}
@media (max-width:860px){.une,.une.seule .actu-grande{grid-template-columns:1fr}}
.grille-actus{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem 1.5rem}
@media (max-width:860px){.grille-actus{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.grille-actus{grid-template-columns:1fr}}
.grille-actus .actu-grande h3{font-size:1.55rem}

/* ---------- Lignes de match (tableau de scores) ---------- */
.scores{border-top:2px solid var(--marine)}
.ligne-match{display:grid;grid-template-columns:5.5rem 1fr auto;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--trait)}
.ligne-match .date{font-family:var(--affiche);font-weight:800;font-size:1.25rem;line-height:1}
.ligne-match .date small{display:block;font-family:var(--texte);font-weight:600;font-size:.75rem;color:var(--texte-2);margin-top:.2rem}
.ligne-match .affiche-m{font-weight:600;line-height:1.35}
.ligne-match .affiche-m .nous{font-weight:800}
.ligne-match .sous{display:flex;gap:.6rem;flex-wrap:wrap;font-size:.8rem;color:var(--texte-2);margin-top:.2rem;font-weight:600}
.lieu-m{display:inline-flex;align-items:center;gap:.3rem}
.lieu-m::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--texte-2)}
.lieu-m.dom::before{background:var(--pelouse)}
.resultat{display:flex;align-items:center;gap:.7rem;font-family:var(--affiche);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.issue{font-family:var(--texte);font-size:.72rem;font-weight:800;min-width:30px;height:24px;padding:0 .4rem;border-radius:4px;display:grid;place-items:center;color:#fff}
.issue.V{background:var(--pelouse)}.issue.D{background:var(--defaite)}.issue.N{background:var(--texte-2)}
.coup-envoi{font-family:var(--affiche);font-weight:800;font-size:1.45rem;color:var(--marine)}
@media (max-width:560px){.ligne-match{grid-template-columns:4.2rem 1fr}.ligne-match > :last-child{grid-column:2}}

/* ---------- Bandeau de page ---------- */
.bandeau-page{position:relative;color:#fff;background:var(--marine);overflow:hidden;isolation:isolate}
.bandeau-page .fond{position:absolute;inset:0;background-size:cover;background-position:center 35%;z-index:-2}
.bandeau-page::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(16,38,74,.94) 0%,rgba(16,38,74,.75) 50%,rgba(16,38,74,.35) 100%)}
.bandeau-page .wrap{padding:clamp(3rem,8vw,5.5rem) 0 clamp(2rem,5vw,3rem)}
.bandeau-page h1{max-width:18ch;text-wrap:balance}
.bandeau-page p{margin-top:1rem;color:#DCE6F5;font-size:1.08rem}
.fil{font-size:.85rem;color:#B9C9E4;margin-bottom:1rem}
.fil a{color:#fff}
.fil span{margin:0 .4rem}

/* ---------- Catégories ---------- */
.groupe + .groupe{margin-top:3.5rem}
.groupe > h2{font-size:clamp(1.8rem,3vw,2.3rem);padding-bottom:.7rem;border-bottom:2px solid var(--marine);margin-bottom:1.5rem}
.grille-cat{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem 1.5rem}
@media (max-width:960px){.grille-cat{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grille-cat{grid-template-columns:1fr}}
.cat{text-decoration:none;display:block}
.cat .visuel{aspect-ratio:4/3;border-radius:var(--r-photo);overflow:hidden;position:relative;background:var(--marine);display:flex;align-items:flex-end;padding:1rem}
.cat .visuel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.cat .visuel::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(16,38,74,.75),transparent 60%)}
.cat:hover .visuel img{transform:scale(1.04)}
.cat .code{position:relative;z-index:1;font-family:var(--affiche);font-weight:900;font-size:3.2rem;line-height:.85;color:#fff}
.cat .sans-photo{background:linear-gradient(160deg,var(--marine-2),var(--marine))}
.cat .sans-photo::before{content:"";position:absolute;right:-18%;top:-30%;width:75%;aspect-ratio:1;border-radius:50%;border:22px solid rgba(143,174,219,.18)}
.cat h3{margin-top:.9rem}
.cat:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.cat p{color:var(--texte-2);font-size:.93rem;margin-top:.3rem}
.cat .jours{font-size:.85rem;font-weight:700;margin-top:.6rem}

/* Fiche catégorie */
.fiche{display:grid;grid-template-columns:1fr 340px;gap:clamp(2rem,5vw,4rem);align-items:start}
@media (max-width:960px){.fiche{grid-template-columns:1fr}}
.fiche section + section{margin-top:3rem}
.fiche h2{font-size:2rem;margin-bottom:1rem}
.horaires{border-top:2px solid var(--marine)}
.horaires div{display:flex;justify-content:space-between;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--trait)}
.horaires b{font-weight:700}
.horaires span{font-family:var(--affiche);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.infos{display:grid;gap:1rem;margin-top:1.4rem}
.info{display:flex;gap:.85rem;align-items:flex-start}
.info .ico{margin-top:3px;color:var(--ciel-fonce)}
.info small{display:block;font-size:.8rem;font-weight:700;color:var(--texte-2)}
.encadrement{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.coach{display:flex;gap:.85rem;align-items:center}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;background:var(--brume);color:var(--marine);display:grid;place-items:center;font-family:var(--affiche);font-weight:800;font-size:1.2rem;object-fit:cover;border:2px solid var(--trait)}
.coach .role{font-size:.85rem;color:var(--texte-2)}
.panneau{position:sticky;top:88px;background:var(--marine);color:#fff;border-radius:var(--r-bloc);padding:1.6rem}
.panneau h2{font-size:1.9rem;margin-bottom:.6rem}
.panneau p{color:#DCE6F5;font-size:.95rem}
.panneau .infos{margin:1.3rem 0}
.panneau .info .ico{color:var(--or)}
.panneau .info small{color:#B9C9E4}
.panneau a:not(.btn){color:#fff}
.panneau .btn{width:100%}
.competitions-cat{display:grid;gap:1rem}
.compet-cat{border:1px solid var(--trait);border-radius:var(--r-bloc);padding:1.1rem 1.2rem}
.compet-cat b{display:block;margin-bottom:.7rem}
.raccourcis{display:flex;flex-wrap:wrap;gap:.5rem}
.raccourci{display:inline-flex;align-items:center;gap:.45rem;min-height:44px;padding:.5rem .9rem;border-radius:var(--r-bouton);border:1px solid var(--trait);background:var(--brume);text-decoration:none;font-weight:700;font-size:.9rem}
.raccourci:hover{background:var(--marine);border-color:var(--marine);color:#fff}
.raccourci .ico{width:18px;height:18px}
.lien-ffr{display:inline-flex;align-items:center;gap:.3rem;margin-top:.7rem;font-size:.85rem;font-weight:600;color:var(--texte-2)}
.lien-ffr .ico{width:14px;height:14px}

/* ---------- Compétitions ---------- */
.selecteur{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--trait);margin-bottom:2rem}
.selecteur::-webkit-scrollbar{display:none}
.selecteur button{flex:none;border:0;background:none;padding:.9rem 1rem;font-weight:700;color:var(--texte-2);border-bottom:3px solid transparent;margin-bottom:-1px;min-height:48px}
.selecteur button:hover{color:var(--marine)}
.selecteur button.actif{color:var(--marine);border-bottom-color:var(--or)}
.compet-tete{display:flex;justify-content:space-between;gap:1.5rem 2rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:2rem}
.compet-tete h2{font-size:clamp(1.8rem,3.4vw,2.5rem);max-width:22ch}
.compet-tete .maj{font-size:.85rem;color:var(--texte-2);margin-top:.6rem}
.bilan{display:flex;gap:2rem}

.bilan b{display:block;font-family:var(--affiche);font-weight:900;font-size:2.8rem;line-height:1}

.bilan .v b{color:var(--pelouse)}.bilan .d b{color:var(--defaite)}
.compet-corps{display:grid;grid-template-columns:1fr 380px;gap:clamp(2rem,4vw,3.5rem);align-items:start}
@media (max-width:960px){.compet-corps{grid-template-columns:1fr}}
.compet-corps.plein{grid-template-columns:1fr}
.bascule{display:inline-flex;background:var(--brume);border-radius:var(--r-bouton);padding:4px;margin-bottom:1.2rem}
.bascule button{border:0;background:none;padding:.55rem 1rem;border-radius:6px;font-weight:700;color:var(--texte-2);min-height:44px}
.bascule button.actif{background:#fff;color:var(--marine);box-shadow:0 1px 2px rgba(16,38,74,.12)}
table.classement{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}

.classement caption h3{font-size:1.6rem}
.classement caption small{display:block;font-size:.82rem;color:var(--texte-2);font-weight:600;margin-top:.2rem;font-family:var(--texte)}
.classement th{font-size:.78rem;font-weight:700;color:var(--texte-2);text-align:left;padding:.5rem .4rem;border-bottom:2px solid var(--marine)}

.vide{padding:2rem;border:1px dashed var(--trait);border-radius:var(--r-bloc);color:var(--texte-2)}

/* ---------- Photothèque ---------- */
.albums{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem 1.5rem}
@media (max-width:860px){.albums{grid-template-columns:1fr 1fr}}

.album{border:0;background:none;text-align:left;padding:0}

.album .couv img,.album .couv .img{width:100%;height:100%;object-fit:cover}
.album h3{margin-top:.8rem;font-size:1.4rem}

.galerie{columns:3 240px;column-gap:.75rem}
.vignette{break-inside:avoid;margin-bottom:.75rem;border-radius:var(--r-photo);overflow:hidden;position:relative;cursor:zoom-in;border:0;width:100%;padding:0;display:block;background:var(--brume)}
.vignette img,.vignette .img{width:100%;display:block}
.vignette .leg{position:absolute;inset:auto 0 0 0;padding:2rem .8rem .7rem;background:linear-gradient(transparent,rgba(16,38,74,.85));color:#fff;font-size:.85rem;font-weight:600;text-align:left;opacity:0;transition:opacity .2s}

@media (hover:none){.vignette .leg{opacity:1}}
.retour{display:inline-flex;align-items:center;gap:.4rem;border:0;background:none;font-weight:700;margin-bottom:1rem;min-height:44px}
.lightbox{position:fixed;inset:0;background:rgba(6,15,32,.96);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.lightbox.ouvert{display:flex}
.lightbox figure{max-width:min(1200px,100%);display:flex;flex-direction:column;align-items:center}
.lightbox img,.lightbox .img{max-height:80vh;width:auto;max-width:100%;border-radius:4px}

.lb-btn{position:absolute;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}

.lb-fermer{top:1rem;right:1rem}.lb-prec{left:1rem;top:50%;transform:translateY(-50%)}.lb-suiv{right:1rem;top:50%;transform:translateY(-50%)}
@media (max-width:620px){.lb-prec,.lb-suiv{top:auto;bottom:1rem;transform:none}}

/* ---------- Article ---------- */
.article{max-width:720px}
.article .photo-article{border-radius:var(--r-photo);overflow:hidden;margin-bottom:2.2rem}
.article p{font-size:1.1rem;line-height:1.7;margin-bottom:1.2rem}

/* ---------- Comité ---------- */
.bureau{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
@media (max-width:860px){.bureau{grid-template-columns:1fr 1fr}}
.membre{border-top:3px solid var(--trait);padding-top:1rem}
.membre.pres{border-top-color:var(--or)}

.commissions{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem 1.5rem;margin-top:1.5rem}
@media (max-width:860px){.commissions{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.commissions{grid-template-columns:1fr}}
.commission h3{font-size:1.35rem;padding-bottom:.5rem;border-bottom:2px solid var(--marine)}
.commission li{list-style:none;display:flex;justify-content:space-between;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--trait);font-size:.93rem}
.commission li span{color:var(--texte-2)}

/* ---------- Appel à rejoindre ---------- */
.rejoindre{position:relative;color:#fff;background:var(--marine);border-radius:var(--r-bloc);overflow:hidden;isolation:isolate;padding:clamp(2rem,5vw,3.5rem);display:grid;grid-template-columns:1.3fr auto;gap:1.5rem 3rem;align-items:end}
.rejoindre .fond{position:absolute;inset:0;background-size:cover;background-position:center 30%;z-index:-2}
.rejoindre::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(16,38,74,.95),rgba(16,38,74,.55))}
.rejoindre p{color:#DCE6F5;margin-top:.7rem}
@media (max-width:760px){.rejoindre{grid-template-columns:1fr}}

/* ---------- Boutique ---------- */
.rayons{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
@media (max-width:860px){.rayons{grid-template-columns:1fr 1fr}}
.rayon{text-decoration:none;display:block}
.rayon .visuel{aspect-ratio:1;background:var(--brume);border-radius:var(--r-photo);display:grid;place-items:center}
.rayon svg{width:58%;height:auto}
.rayon h3{font-size:1.35rem;margin-top:.8rem}
.rayon:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

/* ---------- Formulaire ---------- */
.formulaire{display:grid;gap:1.1rem}

@media (max-width:560px){.deux-champs{grid-template-columns:1fr}}
.champ label{display:block;font-size:.9rem;font-weight:700;margin-bottom:.35rem}
.champ input,.champ select,.champ textarea{width:100%;min-height:48px;padding:.75rem .9rem;border:1.5px solid #B9C7DC;border-radius:var(--r-bouton);font:inherit;background:#fff;color:var(--marine)}
.champ input:focus,.champ select:focus,.champ textarea:focus{outline:none;border-color:var(--marine);box-shadow:0 0 0 3px rgba(240,179,35,.45)}
.message-ok{background:#E5F2EA;color:var(--pelouse);border-left:4px solid var(--pelouse);padding:1rem;border-radius:4px;font-weight:600}

/* ---------- Pied de page ---------- */
footer{background:var(--marine);color:#C5D3EA;padding:3.5rem 0 1.5rem}
.pied{display:grid;grid-template-columns:1.4fr 1fr 1.2fr 1.2fr;gap:2rem}
@media (max-width:900px){.pied{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.pied{grid-template-columns:1fr}}
footer h2{font-size:1.25rem;color:#fff;margin-bottom:.8rem}
footer a{text-decoration:none;display:block;padding:.25rem 0}
footer a:hover{color:#fff;text-decoration:underline}
.pied .marque b{white-space:normal;color:#fff}
.reseaux{display:flex;gap:.5rem;margin-top:1.2rem}

.reseaux a:hover{background:var(--ciel-fonce)}
.reseaux svg{width:20px;height:20px;fill:currentColor}
.bas{border-top:1px solid rgba(255,255,255,.12);margin-top:2.5rem;padding-top:1.3rem;font-size:.82rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>

<a class="sr" href="#app">Aller au contenu</a>
<header class="entete">
  <div class="wrap">
    <a class="marque" href="#accueil" aria-label="Racing Nanterre Rugby, accueil">
      <img src="photos/logo.png" alt="">
      <span><b>Racing Nanterre Rugby</b><small>Club de rugby</small></span>
    </a>
    <button class="burger" aria-label="Menu" aria-expanded="false" aria-controls="nav"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <div class="pied" id="pied"></div>
    <div class="bas"><span>© <span id="annee"></span> Racing Nanterre Rugby, association loi 1901 affiliée à la FFR</span><span>16 rue Salvador Allende, 92000 Nanterre</span></div>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie">
  <button class="lb-btn lb-fermer" aria-label="Fermer"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="lb-btn lb-prec" aria-label="Photo précédente"><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <figure><div id="lb-media"></div><figcaption id="lb-leg"></figcaption></figure>
  <button class="lb-btn lb-suiv" aria-label="Photo suivante"><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<script>
/* ==========================================================================
   LES CONTENUS DU SITE NE SONT PAS ICI.
   Ils sont dans le dossier « content » (un fichier par rubrique) et se modifient
   depuis l'espace d'administration Pages CMS — voir le fichier LISEZMOI.md.
   ========================================================================== */
let CLUB = {};
async function chargerContenus(){
  const fichiers = ['club','actus','categories','competitions','albums','boutique','comite'];
  const lus = await Promise.all(fichiers.map(f => fetch('content/'+f+'.json', {cache:'no-cache'})
    .then(r => { if(!r.ok) throw new Error(f); return r.json(); })));
  const [club, actus, categories, competitions, albums, boutique, comite] = lus;
  CLUB = { ...club, actus: actus||[], categories: categories||[], competitions: competitions||[],
           albums: albums||[], produits: boutique||[], bureau: (comite||{}).bureau||[], commissions: (comite||{}).commissions||[],
           reseaux: club.reseaux||{}, photosPages: club.photosPages||{}, photosAccueil: club.photosAccueil||[],
           presentation: club.presentation||[], valeurs: club.valeurs||[] };
}

/* ======================== Moteur du site ======================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const LOGO = 'photos/logo.png';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const JOURS_LONGS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const d = s => new Date(s + 'T12:00:00');
const dateLongue = s => d(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dateCourte = s => d(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const dateJour = s => { const x = d(s); return `${JOURS_LONGS[x.getDay()]} ${x.getDate()} ${MOIS[x.getMonth()]}`; };
const aujourdhui = new Date(); aujourdhui.setHours(0,0,0,0);
const vide = v => v===undefined || v===null || v==='';
const joue = m => !vide(m.scoreNous) && !vide(m.scoreEux);
const initiales = n => !n || n.includes('compléter') ? '?' : n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const avatar = (nom, photo) => photo ? `<img class="avatar" src="${esc(photo)}" alt="">` : `<span class="avatar" aria-hidden="true">${initiales(nom||'?')}</span>`;
const galerieActu = a => (a.photos||[]).filter(p => p.src && p.src !== a.photo);
const stadeDe = c => (CLUB.stades||[]).find(s => s.nom === c.lieu) || {};
const actusTriees = () => [...CLUB.actus].sort((a,b)=>d(b.date)-d(a.date));
const tel = t => String(t||'').replace(/\s/g,'');

/* Icônes (traits, 24 × 24) */
const I = {
  calendrier:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  liste:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  coupe:'<path d="M8 4h8v5a4 4 0 01-8 0V4zM8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4M12 13v4M8 21h8M9 17h6"/>',
  lieu:'<path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  tel:'<path d="M5 4h3l2 5-2.5 1.5a11 11 0 006 6L15 14l5 2v3a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  horloge:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  parking:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 010 6H9"/>',
  age:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
  externe:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
  retour:'<path d="M15 6l-6 6 6 6"/>',
};
const ico = (n, cls='') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

const raccourcis = c => `<div class="raccourcis">
    <a class="raccourci" href="#compet-${c.id}-calendrier">${ico('calendrier')}Calendrier</a>
    <a class="raccourci" href="#compet-${c.id}-resultats">${ico('liste')}Résultats</a>
    <a class="raccourci" href="#compet-${c.id}-classement">${ico('coupe')}Classement</a>
  </div>`;
const lienFFR = c => c.ffr ? `<a class="lien-ffr" href="${esc(c.ffr)}/calendrier-resultats" target="_blank" rel="noopener">Voir sur le site de la FFR ${ico('externe')}</a>` : '';

const PAGES = [
  {id:'accueil', label:'Accueil'},
  {id:'actualites', label:'Actus'},
  {id:'categories', label:'Catégories'},
  {id:'competitions', label:'Matchs'},
  {id:'photos', label:'Photos'},
  {id:'comite', label:'Le club'},
  {id:'boutique', label:'Boutique'},
  {id:'contact', label:'Venir essayer', cls:'essai'},
];

function image(p, cls=''){ return p && p.src ? `<img class="${cls}" src="${esc(p.src)}" alt="${esc(p.leg||'')}" loading="lazy">` : `<div class="img ${cls}" style="background:linear-gradient(160deg,var(--marine-2),var(--marine));aspect-ratio:4/3"></div>`; }

function bandeau(titre, texte, fil, photo){
  return `<section class="bandeau-page">${photo ? `<div class="fond" style="background-image:url('${esc(photo)}')"></div>` : ''}<div class="wrap">
    ${fil ? `<nav class="fil" aria-label="Fil d'Ariane">${fil}</nav>` : ''}
    <h1>${titre}</h1>${texte ? `<p>${texte}</p>` : ''}
  </div></section>`;
}
const filAccueil = (...etapes) => [`<a href="#accueil">Accueil</a>`, ...etapes].join('<span aria-hidden="true">/</span>');

/* ---------- Matchs ---------- */
function tousMatchs(){ return CLUB.competitions.flatMap(c => c.matchs.map(m => ({...m, equipe:c.nom, compet:c.id}))); }
function ligneMatch(m, montrerEquipe){
  const dt = d(m.date); const fini = joue(m);
  let droite = '';
  if (fini){ const a = +m.scoreNous, b = +m.scoreEux; const r = a>b?'V':a<b?'D':'N';
    droite = `<div class="resultat"><span class="issue ${r}"><span class="sr">${r==='V'?'Victoire':r==='D'?'Défaite':'Match nul'} </span><span aria-hidden="true">${r}</span></span>${a}–${b}</div>`; }
  else if (m.heure) droite = `<span class="coup-envoi">${esc(m.heure)}</span>`;
  else if (m.info) droite = `<span class="secondaire petit">${esc(m.info)}</span>`;
  const nous = `<span class="nous">Racing Nanterre</span>`;
  const affiche = m.dom ? `${nous} contre ${esc(m.adv)}` : `${esc(m.adv)} contre ${nous}`;
  return `<div class="ligne-match">
    <div class="date">${dt.getDate()} ${MOIS[dt.getMonth()]}<small>${JOURS_LONGS[dt.getDay()]}</small></div>
    <div><div class="affiche-m">${affiche}</div>
      <div class="sous"><span class="lieu-m ${m.dom?'dom':''}">${m.dom?'À domicile':'À l’extérieur'}</span>${montrerEquipe?`<span>${esc(m.equipe)}</span>`:''}</div></div>
    ${droite || '<span></span>'}
  </div>`;
}

/* ==================== PAGES ==================== */
const VUES = {

accueil(){
  // Prochain match de chaque équipe
  const prochains = CLUB.competitions.map(c => {
    const m = c.matchs.filter(x => !joue(x) && d(x.date) >= aujourdhui).sort((a,b)=>d(a.date)-d(b.date))[0];
    return m ? {...m, equipe:c.nom, compet:c.id} : null;
  }).filter(Boolean).sort((a,b)=>d(a.date)-d(b.date)).slice(0,4);
  const derniers = tousMatchs().filter(joue).sort((a,b)=>d(b.date)-d(a.date)).slice(0,5);
  const familles = [...new Set(CLUB.categories.map(c=>c.groupe))];
  const actus = actusTriees();
  const photos = CLUB.photosAccueil || [];
  return `
  <section class="heros" aria-label="Présentation">
    ${photos.map((p,i)=>`<div class="photo-fond ${i===0?'on':''}" style="background-image:url('${esc(p)}')"></div>`).join('')}
    <div class="wrap texte">
      <h1>${esc(CLUB.slogan || 'Le rugby à Nanterre')}</h1>
      <p class="chapo">École de rugby labellisée ${CLUB.etoilesEDR||2} étoiles FFR, jeunes, seniors, féminines, rugby loisir et rugby adapté. Une place pour chacun, quel que soit son niveau.</p>
      <div>
        <div class="actions"><a class="btn btn-or" href="#contact">Venir faire un essai</a><a class="btn btn-contour" href="#competitions">Voir les matchs</a></div>
        ${photos.length>1 ? `<div class="photos-nav">${photos.map((p,i)=>`<button class="${i===0?'on':''}" data-d="${i}" aria-label="Afficher la photo ${i+1}"></button>`).join('')}</div>` : ''}
      </div>
    </div>
    ${prochains.length ? `<div class="tableau"><div class="wrap">
      <h2 class="titre-tab">Prochains matchs</h2>
      <div class="affiches">${prochains.map(m=>`<a class="affiche" href="#compet-${m.compet}-calendrier">
        <div class="equipe">${esc(m.equipe)}</div>
        <div class="adv">${m.dom ? 'contre' : 'à'} ${esc(m.adv)}</div>
        <div class="quand"><span>${dateJour(m.date)}</span>${m.heure ? `<span class="heure">${esc(m.heure)}</span>` : ''}</div>
      </a>`).join('')}</div>
    </div></div>` : ''}
  </section>

  <div class="wrap"><div class="reperes">
    <div class="repere"><b>${CLUB.licencies}</b><span>licenciés</span></div>
    <div class="repere"><b>${CLUB.categories.length}</b><span>catégories</span></div>
    <div class="repere"><b>${CLUB.etoilesEDR||2} étoiles</b><span>label FFR de l'école de rugby</span></div>
    <div class="repere"><b>Dès 3 ans</b><span>pour commencer</span></div>
  </div></div>

  <section class="section"><div class="wrap">

/* ---------- Compétitions ---------- */
function afficherCompet(id, modeVoulu){
  const c = CLUB.competitions.find(x=>x.id===id); if(!c) return;
  const joues = c.matchs.filter(joue);
  const V = joues.filter(m=>+m.scoreNous>+m.scoreEux).length, D = joues.filter(m=>+m.scoreNous<+m.scoreEux).length, N = joues.length-V-D;
  const avenir = c.matchs.filter(m=>!joue(m) && d(m.date)>=aujourdhui).sort((a,b)=>d(a.date)-d(b.date));
  const passes = c.matchs.filter(m=>joue(m) || d(m.date)<aujourdhui).sort((a,b)=>d(b.date)-d(a.date));
  const aClassement = c.classement && c.classement.length;
  $('#compet-contenu').innerHTML = `
    <div class="compet-tete"><div><h2>${esc(c.championnat)}</h2>
      ${c.ffr ? `<p class="maj">${c.majLe ? `Matchs mis à jour le ${dateCourte(c.majLe)}. ` : ''}${lienFFR(c)}</p>` : ''}</div>
      ${joues.length ? `<div class="bilan" aria-label="Bilan de la saison"><div class="v"><b>${V}</b><small>victoire${V>1?'s':''}</small></div><div><b>${N}</b><small>nul${N>1?'s':''}</small></div><div class="d"><b>${D}</b><small>défaite${D>1?'s':''}</small></div></div>` : ''}
    </div>
    <div class="compet-corps ${aClassement?'':'plein'}">
      <div>
        ${c.matchs.length ? `<div class="bascule" role="tablist" id="ong-mode" aria-label="Calendrier ou résultats">
          <button role="tab" data-m="avenir">À venir (${avenir.length})</button>
          <button role="tab" data-m="passes">Résultats (${passes.length})</button>
        </div>` : ''}
        <div id="liste-matchs"></div>
      </div>
      ${aClassement ? `<div id="bloc-classement"><table class="classement">
        <caption><h3>Classement</h3>${c.classementLe ? `<small>Au ${dateCourte(c.classementLe)}</small>` : ''}</caption>
        <thead><tr><th scope="col"><span class="sr">Rang</span></th><th scope="col">Équipe</th><th scope="col" class="n">J</th><th scope="col" class="n">Pts</th></tr></thead><tbody>
        ${[...c.classement].sort((a,b)=>b.pts-a.pts).map((e,i)=>`<tr class="${e.nous?'nous':''}"><td class="rang">${i+1}</td><td>${esc(e.equipe)}</td><td class="n">${e.j}</td><td class="n"><b>${e.pts}</b></td></tr>`).join('')}
        </tbody></table></div>` : ''}
    </div>
    ${c.widget ? `<iframe src="${esc(c.widget)}" title="Classement ${esc(c.nom)}" loading="lazy" style="width:100%;min-height:640px;border:0;margin-top:2rem"></iframe>` : ''}`;
  const rendre = mode => {
    const l = mode==='avenir'?avenir:passes;
    $('#liste-matchs').innerHTML = l.length ? `<div class="scores">${l.map(m=>ligneMatch(m)).join('')}</div>` :
      `<div class="vide">${c.matchs.length ? (mode==='avenir'?'Aucun match programmé pour le moment.':'Pas encore de résultat cette saison.') : 'Le calendrier de cette équipe n’est pas encore publié.'} ${lienFFR(c)}</div>`;
    document.querySelectorAll('#ong-mode button').forEach(x=>{ const on = x.dataset.m===mode; x.classList.toggle('actif',on); x.setAttribute('aria-selected',on); });
  };
  const depart = modeVoulu === 'resultats' ? 'passes' : modeVoulu === 'calendrier' ? 'avenir' : (avenir.length ? 'avenir' : 'passes');
  rendre(depart);
  if ($('#ong-mode')) $('#ong-mode').onclick = e => { const b = e.target.closest('button'); if(b) rendre(b.dataset.m); };
}

/* ---------- Photothèque ---------- */
let LB = {liste:[], i:0};
function afficherPhotos(albumId){
  const zone = $('#photos-contenu');
  if (!albumId){
    zone.innerHTML = CLUB.albums.length ? `<div class="albums">${CLUB.albums.map(a=>`<button class="album" data-a="${a.id}">
      <div class="couv">${a.photos.slice(0,3).map(p=>image(p)).join('')}</div>
      <h3>${esc(a.titre)}</h3><div class="meta">${a.date?dateCourte(a.date)+', ':''}${a.photos.length} photo${a.photos.length>1?'s':''}</div>
    </button>`).join('')}</div>` : `<div class="vide">Les premiers albums arrivent bientôt.</div>`;
    return;
  }
  const a = CLUB.albums.find(x=>x.id===albumId);
  LB.liste = a.photos.filter(p=>p.src).map(p=>({src:p.src, leg:p.leg||a.titre}));
  zone.innerHTML = `<button class="retour" data-retour>${ico('retour')}Tous les albums</button>
    <div class="tete"><div><h2>${esc(a.titre)}</h2>${a.date?`<p>${dateLongue(a.date)}</p>`:''}</div></div>
    <div class="galerie">${a.photos.filter(p=>p.src).map((p,i)=>`<button class="vignette" data-i="${i}" aria-label="Agrandir la photo : ${esc(p.leg||a.titre)}"><img src="${esc(p.src)}" alt="${esc(p.leg||a.titre)}" loading="lazy">${p.leg?`<span class="leg">${esc(p.leg)}</span>`:''}</button>`).join('')}</div>`;
}
let dernierFocus = null;
function ouvrirLB(i){ LB.i = (i+LB.liste.length)%LB.liste.length; const p = LB.liste[LB.i];
  if (!$('#lightbox').classList.contains('ouvert')) dernierFocus = document.activeElement;
  $('#lb-media').innerHTML = `<img src="${esc(p.src)}" alt="${esc(p.leg)}">`;
  $('#lb-leg').textContent = `${p.leg} (${LB.i+1} sur ${LB.liste.length})`;
  $('#lightbox').classList.add('ouvert'); $('.lb-fermer').focus(); }
function fermerLB(){ if(!$('#lightbox').classList.contains('ouvert')) return; $('#lightbox').classList.remove('ouvert'); if (dernierFocus) dernierFocus.focus(); }

/* ---------- Photos de l'accueil ---------- */
let diaporama;
function lancerDiaporama(){
  const fonds = [...document.querySelectorAll('.photo-fond')], puces = [...document.querySelectorAll('.photos-nav button')];
  if (fonds.length < 2) return;
  let n = 0;
  const montrer = k => { n = (k + fonds.length) % fonds.length;
    fonds.forEach((x,i)=>x.classList.toggle('on', i===n)); puces.forEach((x,i)=>x.classList.toggle('on', i===n)); };
  const reduit = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const relancer = () => { clearInterval(diaporama); if (!reduit) diaporama = setInterval(()=>montrer(n+1), 7000); };
  $('.photos-nav').onclick = e => { const b = e.target.closest('button'); if(b){ montrer(+b.dataset.d); relancer(); } };
  relancer();
}

/* ---------- Routeur ---------- */
let catPreselect = '';
function route(){
  let h = (location.hash || '#accueil').slice(1);
  let html, actif = h, titre;
  let competVoulue = null, modeVoulu = null;
  const mc = h.match(/^compet-(.+?)(?:-(calendrier|resultats|classement))?$/);
  if (mc && CLUB.competitions.some(x=>x.id===mc[1])){ competVoulue = mc[1]; modeVoulu = mc[2] || null; h = 'competitions'; actif = 'competitions'; }
  if (h.startsWith('actu-')){ html = VUES.actu(h.slice(5)); actif='actualites';
    const a = CLUB.actus.find(x=>x.id===h.slice(5)); titre = a ? a.titre : ''; }
  else if (h.startsWith('cat-')){ html = VUES.categorie(h.slice(4)); actif='categories';
    const c = CLUB.categories.find(x=>x.id===h.slice(4)); titre = c ? c.titre : ''; }
  else if (VUES[h] && !['categorie','actu','introuvable'].includes(h)){ html = VUES[h](); titre = (PAGES.find(p=>p.id===h)||{}).label; }
  else { html = VUES.introuvable(); }
  fermerLB(); clearInterval(diaporama);
  app.innerHTML = html;
  document.title = (titre && h!=='accueil' ? titre + ' | ' : '') + CLUB.nom;
  document.querySelectorAll('.nav a').forEach(a=>{ const on = a.getAttribute('href')==='#'+actif; a.classList.toggle('actif', on); on ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'); });
  document.body.classList.remove('menu-ouvert'); $('.burger').setAttribute('aria-expanded','false');
  window.scrollTo({top:0, behavior:'instant'});

  if (h==='accueil') lancerDiaporama();
  const brancherGalerie = (sel, liste) => { const g = $(sel); if(!g) return; g.onclick = e => { const v=e.target.closest('.vignette'); if(v){ LB.liste = liste; ouvrirLB(+v.dataset.i); } }; };
  if (h.startsWith('actu-')){ const a = CLUB.actus.find(x=>x.id===h.slice(5)); if(a) brancherGalerie('#galerie-actu', galerieActu(a).map(p=>({src:p.src, leg:p.leg||a.titre}))); }
  if (h.startsWith('cat-')){ const c = CLUB.categories.find(x=>x.id===h.slice(4)); if(c) brancherGalerie('#galerie-cat', (c.photos||[]).map(p=>({src:p.src, leg:p.leg||c.titre}))); }
  if (h==='competitions'){ const idc = competVoulue || (CLUB.competitions[0]||{}).id;
    const choisir = id => { document.querySelectorAll('#ong-compet button').forEach(x=>{ const on = x.dataset.c===id; x.classList.toggle('actif',on); x.setAttribute('aria-selected',on); }); };
    afficherCompet(idc, modeVoulu); choisir(idc);
    if (competVoulue) setTimeout(()=>{ const cible = modeVoulu==='classement' && $('#bloc-classement') ? $('#bloc-classement') : $('#compet-contenu'); window.scrollTo({top: cible.getBoundingClientRect().top + scrollY - 90, behavior:'smooth'}); }, 80);
    $('#ong-compet').onclick = e => { const b=e.target.closest('button'); if(!b) return; choisir(b.dataset.c); afficherCompet(b.dataset.c); }; }
  if (h==='photos'){ afficherPhotos('');
    $('#photos-contenu').onclick = e => { if (e.target.closest('[data-retour]')) { afficherPhotos(''); return; }
      const al=e.target.closest('.album'); if(al){ afficherPhotos(al.dataset.a); window.scrollTo({top:$('#photos-contenu').offsetTop-90}); return; }
      const v=e.target.closest('.vignette'); if(v) ouvrirLB(+v.dataset.i); }; }
  if (h==='contact'){
    if (catPreselect){ $('#f-cat').value = catPreselect; catPreselect=''; }
    $('#form-contact').onsubmit = e => { e.preventDefault();
      const f = e.target; const manquant = [...f.querySelectorAll('[required]')].find(x=>!x.value.trim() || (x.type==='email' && !x.checkValidity()));
      if (manquant){ $('#form-retour').innerHTML = `<div class="message-ok" style="background:#FBEAE7;color:var(--defaite);border-color:var(--defaite)">Complétez le champ « ${esc(f.querySelector(`label[for="${manquant.id}"]`).textContent)} » pour continuer.</div>`; manquant.focus(); return; }
      const cat = $('#f-cat').selectedOptions[0].text;
      const corps = `${$('#f-msg').value}\n\n— ${$('#f-nom').value} (${$('#f-mail').value})${$('#f-cat').value?`\nCatégorie : ${cat}`:''}`;
      const lien = `mailto:${CLUB.email}?subject=${encodeURIComponent('[Site] '+$('#f-objet').value)}&body=${encodeURIComponent(corps)}`;
      $('#form-retour').innerHTML = `<div class="message-ok">Votre messagerie s'ouvre avec le message prêt à envoyer. Si rien ne s'ouvre, écrivez directement à ${esc(CLUB.email)}.</div>`;
      location.href = lien; };
  }
  app.focus({preventScroll:true});
}

const RS = {
  facebook:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-2.8 0-4 1.7-4 4.3V10H7v4h3v8h4v-8h3l1-4h-4V8.6c0-.4.3-.6.6-.6z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zM17.3 5.5a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zM12 2c-2.7 0-3 0-4.1.1C4.3 2.3 2.3 4.3 2.1 7.9 2 9 2 9.3 2 12s0 3 .1 4.1c.2 3.6 2.2 5.6 5.8 5.8 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c3.6-.2 5.6-2.2 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.2-3.6-2.2-5.6-5.8-5.8C15 2 14.7 2 12 2zm0 1.8c2.7 0 3 0 4 .1 2.7.1 4 1.4 4.1 4.1.1 1 .1 1.3.1 4s0 3-.1 4c-.1 2.7-1.4 4-4.1 4.1-1 .1-1.3.1-4 .1s-3 0-4-.1c-2.7-.1-4-1.4-4.1-4.1-.1-1-.1-1.3-.1-4s0-3 .1-4C4 5.3 5.3 4 8 3.9c1-.1 1.3-.1 4-.1z"/></svg>',
};
function demarrer(){
  $('.nav').innerHTML = PAGES.map(p=>`<a href="#${p.id}" class="${p.cls||''}">${p.label}</a>`).join('');
  $('.burger').onclick = () => { const o = document.body.classList.toggle('menu-ouvert'); $('.burger').setAttribute('aria-expanded', o); };
  document.addEventListener('click', e => { const a = e.target.closest('[data-cat]'); if(a) catPreselect = a.dataset.cat; });
  $('#lightbox').onclick = e => { if (e.target.closest('.lb-fermer') || e.target.id==='lightbox') fermerLB();
    else if (e.target.closest('.lb-prec')) ouvrirLB(LB.i-1); else if (e.target.closest('.lb-suiv')) ouvrirLB(LB.i+1); };
  document.addEventListener('keydown', e => {
    if (e.key==='Escape' && document.body.classList.contains('menu-ouvert')) { $('.burger').click(); $('.burger').focus(); }
    if(!$('#lightbox').classList.contains('ouvert')) return;
    if(e.key==='Escape') fermerLB(); if(e.key==='ArrowLeft') ouvrirLB(LB.i-1); if(e.key==='ArrowRight') ouvrirLB(LB.i+1); });
  let tx=0; $('#lightbox').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
  $('#lightbox').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) ouvrirLB(LB.i+(dx<0?1:-1));});

  $('#pied').innerHTML = `
    <div><a class="marque" href="#accueil"><img src="${LOGO}" alt=""><span><b>Racing Nanterre Rugby</b><small>Club de rugby</small></span></a>
      <p style="margin-top:1rem;font-size:.92rem">${esc(CLUB.slogan)}</p>
      <div class="reseaux">${Object.entries(CLUB.reseaux).filter(([k,v])=>v).map(([k,v])=>`<a href="${esc(v)}" target="_blank" rel="noopener" aria-label="${k==='facebook'?'Facebook':'Instagram'} du club">${RS[k]||''}</a>`).join('')}</div></div>
    <nav aria-label="Le site"><h2>Le site</h2>${PAGES.filter(p=>p.id!=='contact').map(p=>`<a href="#${p.id}">${p.label}</a>`).join('')}</nav>
    <nav aria-label="Catégories"><h2>Catégories</h2>${CLUB.categories.map(c=>`<a href="#cat-${c.id}">${esc(c.titre)}</a>`).join('')}</nav>
    <div><h2>Contact</h2><p style="font-size:.92rem">${esc(CLUB.adresse)}</p><a href="tel:${tel(CLUB.telephone)}" style="margin-top:.5rem">${esc(CLUB.telephone)}</a><a href="mailto:${esc(CLUB.email)}">${esc(CLUB.email)}</a><a href="${esc(CLUB.boutiqueUrl)}" target="_blank" rel="noopener" style="color:var(--or);font-weight:700;margin-top:.5rem">Boutique en ligne</a></div>`;
  $('#annee').textContent = new Date().getFullYear();

  window.addEventListener('hashchange', route);
  route();
}

chargerContenus().then(demarrer).catch(err => {
  console.error(err);
  app.innerHTML = `<section class="section"><div class="wrap"><div class="vide">Le contenu du site n'a pas pu être chargé (fichier « ${esc(err.message)} »). Rechargez la page. Si vous avez ouvert le fichier depuis votre ordinateur, consultez plutôt le site en ligne.</div></div></section>`;
});
</script>
</body>
</html>
